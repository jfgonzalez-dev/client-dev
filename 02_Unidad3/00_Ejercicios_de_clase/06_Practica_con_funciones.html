<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1
        const notas = [6,3.5,8,9.5,4,7];
        
        console.log(notas.filter(n => n >= 5));
        console.log((notas.reduce((sum, n) => sum + n, 0) / notas.length).toFixed(2));
        console.log(notas.reduce((max, n) => max = (n > max) ? n : max, 0));

        // 2
        const capitalizar = texto => texto
            .split(" ")
            .map(p => p.charAt(0).toUpperCase() + p.slice(1))
            .join(" ");

        console.log(capitalizar("ana garcía lópez"));

        // 3
        const sumaEnteros = n => {
            n = Math.abs(Math.trunc(n));
            if (n < 10) {
                return n;
            }
            return (n % 10) + sumaEnteros(n/10);
        };

        console.log(sumaEnteros(1234));

        const potencia = (base, exponente) => {
            if (exponente === 0) return 1;

            return base * potencia(base, exponente - 1);
        };

        console.log(potencia(2, 3));

    </script>
</body>
</html>
