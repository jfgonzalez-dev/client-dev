<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1
        const notas = [6,3.5,8,9.5,4,7];
        
        console.log(notas.filter(n => n >= 5));
        console.log((notas.reduce((sum, n) => sum + n, 0) / notas.length).toFixed(2));
        console.log(notas.reduce((max, n) => max = (n > max) ? n : max, 0));

        // 2
        const capitalizar = texto => texto
            .split(" ")
            .map(p => p.charAt(0).toUpperCase() + p.slice(1))
            .join(" ");

        console.log(capitalizar("ana garcía lópez"));

        // 3
        /*
        Dos funciones recursivas
        sumaDigitos(n) suma las cifras de un
        número (1234 → 10). potencia(base,
        exp) calcula la potencia sin
        usar Math.pow.
        Pista: n % 10 da la última cifra y
        Math.floor(n / 10) la quita.
        */
    </script>
</body>
</html>
