<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const now = new Date();
        const eval1 = new Date(2026,11,2);
        const semanas = Math.round((eval1 - now) / 1000 / 60 / 60 / 24 / 7);
        let horas = semanas * 6;
        switch (now.getDay()) {
            case 1:
            case 2:
                break;
            case 3:
                horas -= 2;
                break;
            case 4:
            case 5:
                horas -= 4;
                break;
            case 6:
            case 0:
                horas -= 6;
        }
        console.log(`Horas de DWECl hasta la primera evaluación: ${horas}`);
    </script>
</body>
</html>
