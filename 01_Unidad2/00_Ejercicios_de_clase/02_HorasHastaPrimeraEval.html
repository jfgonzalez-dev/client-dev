<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const now = new Date();
        const eval1 = new Date(2026,10,22);

        let hours = 0;

        for (let i = now; i < eval1; i.setDate(i.getDate()+1)) {
            if (
                i.getDay() === 2 ||
                i.getDay() === 3 ||
                i.getDay() === 5
            ) { hours += 2; }
        }

        console.log(`Horas de DWECl hasta la primera evaluación: ${hours}`);
    </script>
</body>
</html>
