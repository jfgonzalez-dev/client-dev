<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="stylesheet" href="./03_BoletinNotas.css">
    
    <!--
    Uso defer para que el script se ejecute solo cuando se haya terminado de cargar el html
    -->
    <script src="03_BoletinNotas.js" defer></script>

    <title>Boletín Notas</title>
</head>
<body>
    <h1>Boletín de notas de la clase</h1>
    <a href="#">Notas</a> | <a href="#">Consultas</a>
    <div>
        <h2>Notas por trimestre</h2>
        <table>
            <thead>
                <tr>
                    <th>Alumno</th>
                    <th>1T</th>
                    <th>2T</th>
                    <th>3T</th>
                    <th>Media</th>
                    <th>Calificación</th>
                </tr>
            </thead>
            <tbody id="studentsTable"></tbody>
        </table>
    </div>
    <div>
        <h2>Añadir alumno</h2>
        <form action="#" id="studentForm">
            <label for="name">Nombre</label> <input id="name" type="text" required>
            <label for="t1">1T:</label><input id="t1" type="number" min="0" max="10" required>
            <label for="t2">2T:</label><input id="t2" type="number" min="0" max="10" required>
            <label for="t3">3T:</label><input id="t3" type="number" min="0" max="10" required>
            <button type="submit">Añadir</button>
        </form>
        <button id="resetBtn">Volver a los datos iniciales</button>
        <p id="output"></p>
    </div>
</body>
</html>
