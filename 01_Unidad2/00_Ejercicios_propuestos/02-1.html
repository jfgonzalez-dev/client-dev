<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="console.log(sum(1,2))">Suma</button>
    <button onclick="console.log(rest(1,2))">Resta</button>
    <button onclick="console.log(mult(1,2))">Multplación</button>
    <button onclick="console.log(div(1,2))">División</button>
    <script>
        function sum(a, b) { return a + b; }
        function rest(a, b) { return a - b; }
        function mult(a, b) { return a * b; }
        function div(a, b) { return b != 0 ? a / b : 0; }
    </script>
</body>
</html>
