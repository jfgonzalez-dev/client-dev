<body>
    <script>
        let circ = {r:5,a:null,l:null};

        function calcAreaAndLenght(c) {
            c.a = Math.PI * c.r ** 2;
            c.l = 2 * Math.PI * c.r;
        }

        calcAreaAndLenght(circ);

        console.log(circ);
    </script>
</body>
