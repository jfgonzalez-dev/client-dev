<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05</title>
</head>
<body>
    <p id="bienvenida">¡Bienvenido!</p>
    <div id="botones">
        <button id="rus" onclick="changeLang(this)">Ruso</button>
        <button id="esp" onclick="changeLang(this)">Español</button>
        <button id="eng" onclick="changeLang(this)">Inglés</button>
    </div>
    <script>
        function changeLang(button) {
            let lang = button.id;
            switch (lang) {
                case "rus":
                    lang = "добро пожаловать!";
                    break;
                case "esp":
                    lang = "¡Bienvenido!";
                    break;
                case "eng":
                    lang = "Welcome!"
                    break;
            }
            document.getElementById("bienvenida").textContent = lang;
        }
    </script>
</body>
</html>
